name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            openjdk-11-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev \
            libssl-dev gettext autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0"
          pip install "cython<3"

      - name: Clean Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Force Python 3.11 for python-for-android
        run: |
          echo "Python:"
          python --version
          which python

          echo "Python 3.11:"
          /opt/hostedtoolcache/Python/3.11.16/x64/bin/python --version

          echo "PATH:"
          which python3
          python3 --version

      - name: Build APK
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          export PATH="/opt/hostedtoolcache/Python/3.11.16/x64/bin:$PATH"
          export PYTHON="/opt/hostedtoolcache/Python/3.11.16/x64/bin/python"
          export PYTHON3="/opt/hostedtoolcache/Python/3.11.16/x64/bin/python"

          python --version
          python3 --version

          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Python-Test-APK
          path: bin/*.apk