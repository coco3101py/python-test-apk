name: Build Android APK

on:
  push:
    branches: [ "main", "master" ] # Tự động build khi có code mới đẩy lên nhánh main/master
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công từ giao diện GitHub

jobs:
  build:
    name: Build APK with Buildozer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Cache lại các thành phần nặng (SDK, NDK) để những lần build sau nhanh hơn
      - name: Cache Buildozer global directory
        uses: actions/cache@v3
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      # Tải file APK thu được lên GitHub Artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.buildozer.outputs.filename }}
