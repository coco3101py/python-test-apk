name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # PYTHON 3.11
      # ==============================
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python
        run: |
          python --version
          which python
          python -m pip --version

      # ==============================
      # JAVA 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Java
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ==============================
      # SYSTEM DEPENDENCIES
      # ==============================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # ==============================
      # ANDROID SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==============================
      # ANDROID SDK COMPONENTS
      # ==============================
      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;35.0.0"

      # ==============================
      # CHECK AIDL
      # ==============================
      - name: Check AIDL
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          echo "Searching AIDL..."

          find "$ANDROID_HOME" \
            -type f \
            -name "aidl" \
            -print

          AIDL=$(find "$ANDROID_HOME" \
            -type f \
            -name "aidl" | head -n 1)

          if [ -z "$AIDL" ]; then
            echo "ERROR: AIDL NOT FOUND"
            exit 1
          fi

          echo "AIDL found:"
          echo "$AIDL"

          "$AIDL" --version

      # ==============================
      # INSTALL BUILDOZER
      # ==============================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5.0"
          python -m pip install "cython<3"

      # ==============================
      # CLEAN BUILDOZER
      # ==============================
      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ==============================
      # BUILD APK
      # ==============================
      - name: Build APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Android:"
          echo "$ANDROID_HOME"

          python -m buildozer android debug

      # ==============================
      # UPLOAD APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk